name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so renamed/removed secret files still get scanned.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          expected=$(grep "  ${tarball}$" /tmp/gitleaks_checksums.txt | awk '{print $1}')
          curl -sSfL "${base}/${tarball}" -o "/tmp/${tarball}"
          actual=$(sha256sum "/tmp/${tarball}" | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "gitleaks checksum mismatch" >&2
            exit 1
          fi
          sudo tar -xz -C /usr/local/bin -f "/tmp/${tarball}" gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # yarn npm audit reads package.json and yarn.lock only; no install needed.
      - run: yarn security:audit

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-ghsas: GHSA-vfj7-8cjw-p6xm

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - name: Cache TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tscache
          key: tsc-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'inertia/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('yarn.lock', 'tsconfig*.json', 'inertia/tsconfig.json') }}-
      # Mirrors the `typecheck` script in package.json (plus incremental build info).
      # Update both together.
      - name: Typecheck
        run: |
          yarn tsc --noEmit --incremental --tsBuildInfoFile .tscache/app.tsbuildinfo
          yarn tsc --noEmit --incremental --tsBuildInfoFile .tscache/inertia.tsbuildinfo --project inertia/tsconfig.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: yarn lint:check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Apt PostgreSQL on the runner — avoids Docker Hub / ECR pull rate limits
    # ("toomanyrequests"). Redis is unused in tests (LIMITER_STORE=memory).
    env:
      # Override .env.test (which targets local Docker on 5433).
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_DATABASE: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres createuser -s test 2>/dev/null || true
          sudo -u postgres psql -c "ALTER USER test WITH PASSWORD 'test';"
          sudo -u postgres psql -c "SELECT 1 FROM pg_database WHERE datname = 'test'" | grep -q 1 \
            || sudo -u postgres createdb -O test test
      - uses: ./.github/actions/setup-app
      - run: yarn test
