yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Keep a normal node_modules tree so Adonis, Vite, and sharp work unchanged.
nodeLinker: node-modules

# Third-party postinstalls stay off unless package.json dependenciesMeta
# sets built: true. The root prepare script (Husky) still runs.
enableScripts: false

# braces@3.0.3 (via micromatch in dev tooling): GHSA-vfj7-8cjw-p6xm has no patched npm release.
npmAuditIgnoreAdvisories:
  - '1240992'
